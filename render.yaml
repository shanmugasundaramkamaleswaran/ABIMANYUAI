services:
  - type: web
    name: abimanyu-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: HF_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: VERCEL_FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RENDER
        value: "true"
    disk:
      name: abimanyu-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
